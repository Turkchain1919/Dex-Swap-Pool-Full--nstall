    stays English.

- term: private key
  doNotTranslate: true
  description: >
    Keep the unit whole — vendor's hybrid "Pribadong Key" splits the term of
    art. Consistent with transaction/backup/clearing-price keeps (Coins.ph,
    PDAX convention).

- term: verified
  preferred: { fil-PH: "Na-verify" }
  status: draft
  description: >
    Completed-aspect Taglish (na- + English root) — the attested pattern of
    na-download/na-charge, NOT the invented-calque class (i-swap/mintahin).
    ⚠️ DRAFT — confirm with native reviewer.

- term: bidding
  preferred: { fil-PH: "Nagbi-bid" }
  status: draft
  description: >
    Auction-status label — active-progressive Taglish (nag- + reduplication)
    on the kept English root; the "bid" noun itself stays English. ⚠️ DRAFT —
    native review on register vs a nominal chip.

- term: identity verification
  preferred: { fil-PH: "Pag-verify ng Pagkakakilanlan" }
  status: draft
  description: >
    KYC copy — "verify" nominalized as a kept-English loanword, "identity"
    translated natively, consistent with the selective-keep strategy.
    ⚠️ DRAFT — confirm with native reviewer.

- term: auth vocabulary (verification code, recovery email, login)
  description: >
    Context note: authentication/security vocabulary keeps English —
    "verification code", "recovery email", "login", "backup" (see its DNT
    entry) — per Apple iOS Philippines convention. General-UI phrases around
    them still take Filipino syntax ("Backup sa iCloud").

- term: checkout
  doNotTranslate: true
  status: draft
  description: >
    On-ramp checkout surface — Taglish keeps the English term. Per-locale on
    purpose: es/fr/pt render native checkout terms, so this must NOT live in
    core. ⚠️ DRAFT — confirm with native reviewer.
