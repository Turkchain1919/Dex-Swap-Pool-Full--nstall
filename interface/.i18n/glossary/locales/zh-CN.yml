# Chinese, Simplified (zh-CN) glossary.
#
# Seeded from the Notion "i18n style guide: Chinese, Simplified" term table and
# hardened with the March-2026 audit's wrong-word findings as `forbidden`.
# Register (use 你, not the over-formal 您) lives in ../../style/locales/zh-CN.md.

- term: wallet
  preferred: { zh-CN: "钱包" }

- term: smart wallet
  preferred: { zh-CN: "智能钱包" }

- term: token
  preferred: { zh-CN: "代币" }

- term: network cost
  preferred: { zh-CN: "网络费用" }

- term: fee
  preferred: { zh-CN: "费用" }

- term: app fee
  preferred: { zh-CN: "App 手续费" }
  forbidden: { zh-CN: ["应用费用", "应用程序费用", "应用程序手续费"] }
  description: >
    "Zero app fees" is a core marketing claim. Crypto-native Chinese renders
    "app fee" as "App 手续费" — keep "App" in Latin, 手续费 = transaction fee.
    NOT the literal "应用费用" (application cost). Native-reviewer note
    (Melody, 2026-07-01). More specific than the generic `fee` → 费用.

